name: Android Build

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Assemble release APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Decode release keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | tr -d '\r\n' | base64 --decode > "$RUNNER_TEMP/vyxel-release.jks"
          chmod 600 "$RUNNER_TEMP/vyxel-release.jks"
          keytool -list -keystore "$RUNNER_TEMP/vyxel-release.jks" -storepass "${{ secrets.KEYSTORE_PASSWORD }}" > /dev/null
          echo "Keystore OK"

      - name: Assemble release APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/vyxel-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease

      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: vyxel-launcher-signed-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Create / update GitHub Release with APK
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: Vyxel Launcher v1.0.0
          body: |
            Signed release build of the Vyxel Launcher (Kotlin / Jetpack Compose).

            Features: custom home screen, advanced app drawer, universal app search, widgets,
            notification panel integration, gesture engine, icon-pack system, dynamic theming,
            wallpaper engine, folders, app shortcuts, multi-page grid, backup/restore, import/export
            layouts, per-app icons, custom icon shapes, dock customization, animation engine,
            blur/transparency controls, custom fonts, clock/weather components and hidden apps.

            This APK is signed with the project release key and can be installed directly on
            Android 8.0+ devices (set it as your default launcher after installing).
          files: app/build/outputs/apk/release/*.apk
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
